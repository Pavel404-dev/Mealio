name: Backend Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Run backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: mealio_test
          POSTGRES_USER: mealio_user
          POSTGRES_PASSWORD: mealio_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U mealio_user -d mealio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://mealio_user:mealio_password@localhost:5432/mealio_test
      TEST_DATABASE_URL: postgresql+asyncpg://mealio_user:mealio_password@localhost:5432/mealio_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend tests
        run: python -m pytest -v