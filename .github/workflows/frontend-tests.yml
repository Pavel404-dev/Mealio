name: Frontend Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Run frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: |
          git ls-files --error-unmatch pubspec.lock
          flutter pub get --enforce-lockfile
          git diff --exit-code HEAD -- pubspec.lock

      - name: Check localization catalogs
        working-directory: frontend
        run: |
          dart run tool/check_l10n.dart
          flutter gen-l10n

      - name: Check frontend formatting
        working-directory: frontend
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze frontend
        working-directory: frontend
        run: flutter analyze --no-pub

      - name: Run frontend tests
        working-directory: frontend
        run: flutter test --no-pub

      - name: Confirm frontend lockfile is unchanged
        if: always()
        working-directory: frontend
        run: git diff --exit-code HEAD -- pubspec.lock
