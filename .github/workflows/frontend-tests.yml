name: Frontend Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Run frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java for synthetic QA signing tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: |
          git ls-files --error-unmatch pubspec.lock
          flutter pub get --enforce-lockfile
          git diff --exit-code HEAD -- pubspec.lock

      # These tests generate disposable keys and never receive repository secrets.
      - name: Test Android QA signing, Gradle configuration, and installer
        env:
          MEALIO_TEST_GRADLE: "1"
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter config --android-sdk="$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Check localization catalogs
        working-directory: frontend
        run: |
          dart run tool/check_l10n.dart
          flutter gen-l10n

      - name: Check frontend formatting
        working-directory: frontend
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze frontend
        working-directory: frontend
        run: flutter analyze --no-pub

      - name: Run frontend tests
        working-directory: frontend
        run: flutter test --no-pub

      - name: Confirm frontend lockfile is unchanged
        if: always()
        working-directory: frontend
        run: git diff --exit-code HEAD -- pubspec.lock
