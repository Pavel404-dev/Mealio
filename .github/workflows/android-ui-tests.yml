name: Android UI Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".maestro/**"
      - "scripts/run-android-ui-tests.sh"
      - ".github/workflows/android-ui-tests.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".maestro/**"
      - "scripts/run-android-ui-tests.sh"
      - ".github/workflows/android-ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar:
    name: Meal Plan calendar and Retry
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mealio_android_qa
          POSTGRES_USER: mealio_user
          POSTGRES_PASSWORD: mealio_android_qa_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mealio_user -d mealio_android_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://mealio_user:mealio_android_qa_password@127.0.0.1:5432/mealio_android_qa
      JWT_SECRET_KEY: mealio_android_qa_fixture_jwt_key_32chars
      AUTH_ABUSE_PEPPER: mealio_android_qa_fixture_abuse_pepper_32chars
      MAESTRO_CLI_NO_ANALYTICS: "true"
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "60000"

    steps:
      - name: Check out source commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install and migrate the test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m alembic upgrade head

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Configure Android SDK and emulator acceleration
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter config --android-sdk="$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro 2.13.0
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.13.0/maestro.zip \
            --output "$RUNNER_TEMP/maestro.zip"
          (
            cd "$RUNNER_TEMP"
            echo 'ccc536679ed35e3a84b7e9e5c364f2371204c291fb331fec8c00e3e496dda5ff  maestro.zip' \
              | sha256sum --check
            unzip -q maestro.zip
          )
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      - name: Build the emulator APK
        working-directory: frontend
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          flutter pub get --enforce-lockfile
          flutter build apk --debug --target-platform=android-x64 --no-pub \
            --dart-define=API_BASE_URL=http://10.0.2.2:8120
          git diff --exit-code HEAD -- pubspec.lock
          cd android
          ./gradlew --stop

      - name: Install APK and run Maestro on Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-android-ui-tests.sh frontend/build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/android-ui"

      - name: Upload UI reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mealio-android-ui-${{ github.sha }}
          path: ${{ runner.temp }}/android-ui/
          retention-days: 7
