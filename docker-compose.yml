services:
  postgres:
    image: postgres:17
    container_name: mealio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - mealio_postgres_data:/var/lib/postgresql/data

volumes:
  mealio_postgres_data: