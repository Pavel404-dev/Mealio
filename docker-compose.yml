services:
  postgres:
    image: postgres:17
    container_name: mealio-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mealio
      POSTGRES_USER: mealio_user
      POSTGRES_PASSWORD: mealio_password

    ports:
      - "5432:5432"

    volumes:
      - mealio_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealio_user -d mealio"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: mealio-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+asyncpg://mealio_user:mealio_password@postgres:5432/mealio
      TEST_DATABASE_URL: postgresql+asyncpg://mealio_user:mealio_password@postgres:5432/mealio_test
      JWT_SECRET_KEY: dev_mealio_secret_key_change_later_123456789
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  mealio_postgres_data: